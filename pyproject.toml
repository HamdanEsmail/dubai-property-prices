[project]
name = "dubai-property-prices"
version = "0.1.0"
description = "Dubai property price explorer and model built on Dubai Land Department open transaction data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dubai-prices = "dubai_prices.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubai_prices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
